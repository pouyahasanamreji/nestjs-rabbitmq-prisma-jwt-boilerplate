services:
  users:
    container_name: microservice_repo_users_service
    build:
      context: .
      dockerfile: ./apps/users/Dockerfile
      target: development
    command: sh -c "npm rebuild bcrypt --build-from-source && npm run start:dev users"
    env_file:
      - ./apps/users/.env
    depends_on:
      - mariadb
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - microservice_node_modules:/usr/src/app/node_modules
    networks:
      - microservice_network

  auth:
    container_name: microservice_repo_auth_service
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    command: npm run start:dev auth
    env_file:
      - ./apps/auth/.env
    depends_on:
      - mariadb
      - rabbitmq
      - users
      - authorization
    volumes:
      - .:/usr/src/app
      - microservice_node_modules:/usr/src/app/node_modules
    networks:
      - microservice_network

  authorization:
    container_name: microservice_repo_authorization_service
    build:
      context: .
      dockerfile: ./apps/authorization/Dockerfile
      target: development
    command: npm run start:dev authorization
    env_file:
      - ./apps/authorization/.env
    depends_on:
      - mariadb
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - microservice_node_modules:/usr/src/app/node_modules
    networks:
      - microservice_network

  configurations:
    container_name: microservice_repo_configurations_service
    build:
      context: .
      dockerfile: ./apps/configurations/Dockerfile
      target: development
    command: npm run start:dev configurations
    env_file:
      - ./apps/configurations/.env
    depends_on:
      - mariadb
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - microservice_node_modules:/usr/src/app/node_modules
    networks:
      - microservice_network

  gateway:
    container_name: microservice_repo_gateway_service
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
      target: development
    command: npm run start:dev gateway
    env_file:
      - ./apps/gateway/.env
    depends_on:
      - mariadb
      - rabbitmq
      - configurations
      - users
      - auth
    volumes:
      - .:/usr/src/app
      - microservice_node_modules:/usr/src/app/node_modules
    ports:
      - '3000:3000'
    networks:
      - microservice_network

  rabbitmq:
    container_name: microservice_repo_rabbitmq_service
    image: rabbitmq:3.13.3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - microservice_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservice_network

  mariadb:
    container_name: microservice_repo_mariadb_service
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pos
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - microservice_mariadb_data:/var/lib/mysql
    ports:
      - '3306:3306'
    networks:
      - microservice_network

  phpmyadmin:
    container_name: microservice_repo_phpmyadmin_service
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_USER: user
      PMA_PASSWORD: password
    ports:
      - '8080:80'
    depends_on:
      - mariadb
    networks:
      - microservice_network

volumes:
  microservice_mariadb_data:
    name: microservice_mariadb_data
  microservice_rabbitmq_data:
    name: microservice_rabbitmq_data
  microservice_node_modules:
    name: microservice_node_modules

networks:
  microservice_network: